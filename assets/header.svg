<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-label="Terminal: Befikir T. Bogale, Ph.D. student in Computer Science at the University of Tennessee, Knoxville, working on HPC performance analysis">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .user { fill: #ff8200; font-weight: 700; }
    .path { fill: #2dd4bf; font-weight: 700; }
    .sym  { fill: #8b949e; }
    .cmd  { fill: #e6edf3; }
    .out  { fill: #c9d1d9; }
    .dim  { fill: #8b949e; }
    .hi   { fill: #ff8200; }
    .tl   { fill: #2dd4bf; }

    .show { opacity: 0; animation: show .01s linear both; }
    @keyframes show { to { opacity: 1; } }
    .rise { opacity: 0; animation: rise .5s ease-out both; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .t1 { animation: type .6s steps(6) .3s both; }
    .t2 { animation: type .8s steps(13) 1.8s both; }
    @keyframes type { from { width: 0; } }

    .cursor { animation: show .01s linear 3.6s both, blink 1.1s steps(1) 3.6s infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .show, .rise, .cursor { animation: none; opacity: 1; }
      .t1, .t2 { animation: none; }
    }
  </style>

  <defs>
    <clipPath id="c1"><rect class="t1" x="181" y="62" width="56" height="26"/></clipPath>
    <clipPath id="c2"><rect class="t2" x="181" y="196" width="120" height="26"/></clipPath>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#ff8200"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>

  <!-- window -->
  <rect x="1" y="1" width="898" height="338" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <path d="M1 13 a12 12 0 0 1 12 -12 h874 a12 12 0 0 1 12 12 v23 h-898 z" fill="#161b22"/>
  <line x1="1" y1="36" x2="899" y2="36" stroke="#30363d"/>
  <circle cx="22" cy="18.5" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="18.5" r="6" fill="#febc2e"/>
  <circle cx="62" cy="18.5" r="6" fill="#28c840"/>
  <text x="450" y="23" text-anchor="middle" class="mono dim" style="font-size:12.5px">befikir@gclab: ~ — zsh</text>

  <!-- $ whoami -->
  <text x="28" y="80" class="mono" textLength="144" lengthAdjust="spacingAndGlyphs"><tspan class="user">befikir@gclab</tspan><tspan class="sym">:</tspan><tspan class="path">~</tspan><tspan class="sym">$</tspan></text>
  <text x="181" y="80" class="mono cmd" clip-path="url(#c1)">whoami</text>

  <g class="rise" style="animation-delay:1.05s">
    <text x="28" y="128" class="sans" fill="#f0f6fc" style="font-size:36px;font-weight:700;letter-spacing:-.5px">Befikir T. Bogale</text>
  </g>
  <g class="rise" style="animation-delay:1.3s">
    <text x="28" y="158" class="mono dim">Ph.D. student · Computer Science (HPC) · University of Tennessee, Knoxville</text>
    <rect x="28" y="172" width="240" height="3" rx="1.5" fill="url(#bar)"/>
  </g>

  <!-- $ cat focus.txt -->
  <g class="show" style="animation-delay:1.7s">
    <text x="28" y="214" class="mono" textLength="144" lengthAdjust="spacingAndGlyphs"><tspan class="user">befikir@gclab</tspan><tspan class="sym">:</tspan><tspan class="path">~</tspan><tspan class="sym">$</tspan></text>
  </g>
  <text x="181" y="214" class="mono cmd" clip-path="url(#c2)">cat focus.txt</text>

  <text x="28" y="242" class="mono out show" style="animation-delay:2.75s"><tspan class="hi">▸ </tspan>performance analysis tooling for HPC systems</text>
  <text x="28" y="266" class="mono out show" style="animation-delay:2.95s"><tspan class="hi">▸ </tspan>tying compiler optimization decisions to runtime performance</text>
  <text x="28" y="290" class="mono out show" style="animation-delay:3.15s"><tspan class="hi">▸ </tspan><tspan class="tl">Thicket</tspan> · <tspan class="tl">Hatchet</tspan> · <tspan class="tl">Caliper</tspan> · <tspan class="tl">RAJAPerf</tspan> · <tspan class="tl">LLVM</tspan></text>

  <!-- idle prompt -->
  <g class="show" style="animation-delay:3.5s">
    <text x="28" y="320" class="mono" textLength="144" lengthAdjust="spacingAndGlyphs"><tspan class="user">befikir@gclab</tspan><tspan class="sym">:</tspan><tspan class="path">~</tspan><tspan class="sym">$</tspan></text>
  </g>
  <rect class="cursor" x="181" y="306" width="9" height="18" fill="#e6edf3"/>
</svg>
